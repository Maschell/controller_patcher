// Retro-bit SEGA Saturn Wireless 8-Button Arcade Pad (V1), USB 2.4GHz receiver
// The receiver enumerates as a HORIPAD for Nintendo Switch (Hori VID 0x0F0D, PID 0x00C1),
// but reports its D-Pad differently from a genuine HORIPAD (see below).
// Tested with the V1 USB receiver on firmware 1.1 (Retro-bit's January 2020 latency update).
// V2 receivers (marked "V2") use different firmware and may report a different VID/PID.
// Don't install this alongside "Horipad Switch.ini": both use the same VID/PID, so their
// settings would be merged, bringing back the hat D-Pad and right stick mappings.
[vid=0x0F0D,pid=0x00C1]

// HID report layout (8 bytes, no report ID):
//   0x00     buttons: Y=0x01 B=0x02 A=0x04 X=0x08 L=0x10 R=0x20 ZL=0x40 ZR=0x80
//   0x01     buttons: Minus=0x01 Plus=0x02 LStick=0x04 RStick=0x08 Home=0x10 Capture=0x20
//   0x02     hat: 0=N 1=NE 2=E 3=SE 4=S 5=SW 6=W 7=NW 0x0F=neutral (always 0x0F on this pad)
//   0x03-06  LX, LY, RX, RY (0x00-0xFF, centre 0x80, Y up = 0x00); the D-Pad drives LX/LY
//   0x07     vendor specific

// The receiver sends reports continuously while a pad is linked, and simply stops when the pad
// sleeps or its battery dies, leaving the last report in place. Treat the pad as disconnected
// after 500ms without a report, so input held at that moment doesn't stay stuck on.
// Needs a controller_patcher build with REPORT_TIMEOUT support (ignored otherwise).
REPORT_TIMEOUT                = 0x32

// Saturn buttons arrive as: A=0x04 B=0x02 C=0x80 X=0x08 Y=0x01 Z=0x40 L=0x10 R=0x20 (all byte 0x00;
// confirmed with HID-TEST)

// Layout 1 (default), by position: face buttons match the Wii U GamePad's physical layout,
// and the six-button rows match SNES fighting games on Virtual Console (e.g. Street Fighter II:
// top row X/Y/Z = light/medium/heavy punch, bottom row A/B/C = light/medium/heavy kick).
// Saturn L/R become ZL/ZR, as in the sys-con Mega Drive layout. Mario Kart 8 still works,
// since it accepts ZL/ZR as well as L/R.
VPAD_BUTTON_Y                 = 0x00, 0x08  // Saturn X
VPAD_BUTTON_X                 = 0x00, 0x01  // Saturn Y
VPAD_BUTTON_L                 = 0x00, 0x40  // Saturn Z
VPAD_BUTTON_B                 = 0x00, 0x04  // Saturn A
VPAD_BUTTON_A                 = 0x00, 0x02  // Saturn B
VPAD_BUTTON_R                 = 0x00, 0x80  // Saturn C
VPAD_BUTTON_ZL                = 0x00, 0x10  // Saturn L
VPAD_BUTTON_ZR                = 0x00, 0x20  // Saturn R

// Layout 2, by label: Saturn A/B/X/Y act as the Wii U buttons with the same letters,
// L/R as L/R, with Z and C left over as ZL and ZR.
// Comment out Layout 1 and uncomment these to use it.
// VPAD_BUTTON_A              = 0x00, 0x04  // Saturn A
// VPAD_BUTTON_B              = 0x00, 0x02  // Saturn B
// VPAD_BUTTON_X              = 0x00, 0x08  // Saturn X
// VPAD_BUTTON_Y              = 0x00, 0x01  // Saturn Y
// VPAD_BUTTON_L              = 0x00, 0x10  // Saturn L
// VPAD_BUTTON_R              = 0x00, 0x20  // Saturn R
// VPAD_BUTTON_ZL             = 0x00, 0x40  // Saturn Z
// VPAD_BUTTON_ZR             = 0x00, 0x80  // Saturn C

// System buttons (Select, Start and Home confirmed with HID-TEST)
VPAD_BUTTON_MINUS             = 0x01, 0x01  // Saturn Select
VPAD_BUTTON_PLUS              = 0x01, 0x02  // Saturn Start
VPAD_BUTTON_HOME              = 0x01, 0x10  // Saturn Home

// D-Pad: this receiver leaves the hat (byte 0x02) at 0x0F and reports the
// D-Pad on the left stick bytes instead (0x03 = X, 0x04 = Y), resting at 0x80
// and at exactly 0x00 / 0xFF per direction. A genuine HORIPAD uses the hat
// instead, so this file doesn't suit one.

// D-Pad option 1 (default), D-Pad only: absolute mode turns those bytes into Wii U
// D-Pad presses, with no stick input at all. Works in Virtual Console, 2D games and
// Mario Kart 8; games that only read the left stick for movement won't respond to it.
DPAD_MODE                     = DPAD_ABSOLUTE_2VALUES
VPAD_BUTTON_DPAD_ABS_LEFT     = 0x03, 0x00
VPAD_BUTTON_DPAD_ABS_RIGHT    = 0x03, 0xFF
VPAD_BUTTON_DPAD_ABS_UP       = 0x04, 0x00
VPAD_BUTTON_DPAD_ABS_DOWN     = 0x04, 0xFF

// D-Pad option 2, left stick only: passes the bytes through as the left stick, as
// the receiver reports them. For games that only read the left stick for movement;
// SNES Virtual Console also accepts the left stick as its D-Pad. Don't combine with option 1:
// games that give the stick and D-Pad different jobs would get both at once.
// Comment out option 1 and uncomment these to use it.
// VPAD_L_STICK_X             = 0x03, 0x80
// VPAD_L_STICK_X_MINMAX      = 0x00, 0xFF
// VPAD_L_STICK_X_DEADZONE    = 0x08
// VPAD_L_STICK_Y             = 0x04, 0x80
// VPAD_L_STICK_Y_MINMAX      = 0x00, 0xFF
// VPAD_L_STICK_Y_DEADZONE    = 0x08
// VPAD_L_STICK_Y_INVERT      = True

// The pad has no analog sticks or stick clicks, so the right stick (bytes 0x05/0x06)
// and stick-click bits are deliberately left unmapped.
